<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Create · OC 故事生成器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">C</div>
        <div class="brand-copy">
          <div class="brand-name">Create</div>
          <div class="brand-sub">OC 故事生成器</div>
        </div>
      </div>

      <nav class="nav" aria-label="主导航">
        <button class="nav-btn active" data-view="world"><span class="ic" data-icon="globe"></span><span>世界观</span></button>
        <button class="nav-btn" data-view="ocs"><span class="ic" data-icon="users"></span><span>OC 档案</span></button>
        <button class="nav-btn" data-view="npcs"><span class="ic" data-icon="target"></span><span>反派 / NPC</span></button>
        <button class="nav-btn" data-view="story"><span class="ic" data-icon="book"></span><span>故事设定</span></button>
        <button class="nav-btn" data-view="generate"><span class="ic" data-icon="sparkles"></span><span>生成器</span></button>
        <button class="nav-btn" data-view="history"><span class="ic" data-icon="clock"></span><span>历史记录</span></button>
      </nav>

      <div class="sidebar-bottom">
        <button id="btn-import" class="ghost-btn full"><span class="ic" data-icon="upload"></span><span>导入设定</span></button>
        <button id="btn-settings" class="ghost-btn full"><span class="ic" data-icon="settings"></span><span>API 设置</span></button>
      </div>
    </aside>

    <main class="main">
      <section id="view-world" class="view active">
        <div class="view-head">
          <h1>世界观</h1>
          <p class="view-sub">时代 · 势力 · 规则 · 魔法科技 · 世界冲突</p>
        </div>
        <div class="panel">
          <div class="grid-2">
            <label class="field">
              <span>时代</span>
              <textarea data-bind="world.era" rows="3" placeholder="例如：架空中世纪 / 近未来 / 现代都市"></textarea>
            </label>
            <label class="field">
              <span>势力</span>
              <textarea data-bind="world.factions" rows="3" placeholder="主要势力、组织、阵营"></textarea>
            </label>
            <label class="field">
              <span>规则</span>
              <textarea data-bind="world.rules" rows="3" placeholder="世界运转规则、禁忌、代价"></textarea>
            </label>
            <label class="field">
              <span>魔法 / 科技</span>
              <textarea data-bind="world.magic" rows="3" placeholder="能力体系、科技水平、限制"></textarea>
            </label>
          </div>
          <label class="field full">
            <span>世界冲突</span>
            <textarea data-bind="world.conflict" rows="3" placeholder="核心矛盾、战争、危机"></textarea>
          </label>
          <label class="field full">
            <span>原始素材</span>
            <textarea data-bind="world.raw" rows="6" placeholder="世界观部分的完整原文，可整段粘贴"></textarea>
          </label>
        </div>
      </section>

      <section id="view-ocs" class="view">
        <div class="view-head">
          <div>
            <h1>OC 档案</h1>
            <p class="view-sub">参与故事的原创角色</p>
          </div>
          <div class="count-control">
            <button class="icon-btn" id="oc-dec" title="减少" aria-label="减少角色">-</button>
            <input type="number" id="oc-count" min="0" max="12" value="0" aria-label="OC 数量">
            <button class="icon-btn" id="oc-inc" title="增加" aria-label="增加角色">+</button>
          </div>
        </div>
        <div id="oc-list" class="card-list"></div>
      </section>

      <section id="view-npcs" class="view">
        <div class="view-head">
          <div>
            <h1>反派 / NPC</h1>
            <p class="view-sub">没有就留空</p>
          </div>
          <button id="npc-add" class="ghost-btn"><span class="ic" data-icon="plus"></span><span>新增 NPC</span></button>
        </div>
        <label class="switch-row">
          <input type="checkbox" id="npc-none">
          <span>本故事无反派 / NPC</span>
        </label>
        <div id="npc-list" class="card-list"></div>
      </section>

      <section id="view-story" class="view">
        <div class="view-head">
          <h1>故事设定</h1>
          <p class="view-sub">类型 · 核心冲突 · 篇幅 · 基调 · 结局 · 限制</p>
        </div>
        <div class="panel">
          <div class="field">
            <span>故事类型</span>
            <div id="type-chips" class="chip-row"></div>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>自定义类型</span>
              <input data-bind="story.otherType" placeholder="其他故事类型">
            </label>
            <label class="field">
              <span>篇幅</span>
              <input data-bind="story.length" placeholder="例如：3000 字短篇 / 15000 字中篇">
            </label>
          </div>
          <label class="field full">
            <span>核心冲突</span>
            <textarea data-bind="story.conflict" rows="4" placeholder="故事要解决的核心冲突"></textarea>
          </label>
          <div class="grid-2">
            <label class="field">
              <span>故事基调</span>
              <input data-bind="story.tone" placeholder="例如：温柔治愈 / 压抑悬疑 / 热血">
            </label>
            <label class="field">
              <span>结局</span>
              <select data-bind="story.ending">
                <option value="">选择结局</option>
                <option value="圆满结局">圆满结局</option>
                <option value="遗憾结局">遗憾结局</option>
                <option value="开放式结局">开放式结局</option>
                <option value="黑暗结局">黑暗结局</option>
                <option value="自定义">自定义</option>
              </select>
            </label>
          </div>
          <label class="field full" id="custom-ending-wrap" hidden>
            <span>自定义结局</span>
            <input data-bind="story.customEnding" placeholder="具体结局要求">
          </label>
          <label class="field full">
            <span>额外创作限制</span>
            <textarea data-bind="story.restrictions" rows="4" placeholder="禁止出现的内容、必须保留的细节、其他硬性要求"></textarea>
          </label>
        </div>
      </section>

      <section id="view-generate" class="view">
        <div class="view-head">
          <h1>生成器</h1>
          <p class="view-sub">严格使用已填设定，不编造、不 OOC</p>
        </div>
        <div id="readiness" class="readiness"></div>
        <div class="gen-layout">
          <aside class="panel gen-options">
            <h2>生成选项</h2>
            <label class="field">
              <span>叙述视角</span>
              <select data-bind="gen.pov">
                <option value="全知视角">全知视角</option>
                <option value="限知视角">限知视角</option>
                <option value="第一人称">第一人称</option>
              </select>
            </label>
            <label class="field">
              <span>文风</span>
              <select data-bind="gen.style">
                <option value="自然细腻">自然细腻</option>
                <option value="简洁冷峻">简洁冷峻</option>
                <option value="轻松日常">轻松日常</option>
                <option value="诗意留白">诗意留白</option>
                <option value="自定义">自定义</option>
              </select>
            </label>
            <label class="field">
              <span>自定义文风</span>
              <input data-bind="gen.customStyle" placeholder="补充文风要求">
            </label>
            <label class="switch-row">
              <input type="checkbox" data-bind-check="gen.chapters">
              <span>分章节</span>
            </label>
            <label class="field" id="chapter-row">
              <span>章节数</span>
              <input type="number" data-bind="gen.chapterCount" min="1" max="20" value="3">
            </label>
            <label class="field">
              <span>追加要求</span>
              <textarea data-bind="gen.extra" rows="4" placeholder="本次生成额外要求"></textarea>
            </label>
            <button id="btn-generate" class="primary-btn full"><span class="ic" data-icon="sparkles"></span><span>生成故事</span></button>
          </aside>

          <section class="panel story-panel">
            <div class="story-toolbar">
              <div class="seg" role="tablist" aria-label="故事视图">
                <button class="active" data-storytab="read">阅读</button>
                <button data-storytab="edit">编辑</button>
              </div>
              <div class="actions">
                <button class="ghost-btn sm" id="btn-regen"><span class="ic" data-icon="refresh"></span><span>重新生成</span></button>
                <button class="ghost-btn sm" id="btn-continue"><span class="ic" data-icon="forward"></span><span>续写</span></button>
                <button class="ghost-btn sm" id="btn-check"><span class="ic" data-icon="check"></span><span>设定检查</span></button>
                <button class="ghost-btn sm" id="btn-copy"><span class="ic" data-icon="copy"></span><span>复制</span></button>
                <button class="ghost-btn sm" id="btn-download"><span class="ic" data-icon="download"></span><span>下载</span></button>
                <button class="ghost-btn sm" id="btn-save"><span class="ic" data-icon="save"></span><span>存历史</span></button>
              </div>
            </div>
            <div id="story-read" class="story-read"></div>
            <textarea id="story-edit" class="story-edit" rows="24" hidden></textarea>
          </section>
        </div>
      </section>

      <section id="view-history" class="view">
        <div class="view-head">
          <h1>历史记录</h1>
          <p class="view-sub">保存在本机浏览器中的故事</p>
        </div>
        <div id="history-list" class="card-list"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <dialog id="settings-dialog" class="modal">
    <form method="dialog" class="modal-card">
      <div class="modal-head">
        <h2>API 设置</h2>
        <button class="icon-btn" value="cancel" aria-label="关闭"><span class="ic" data-icon="close"></span></button>
      </div>
      <div class="modal-body">
        <div id="server-config-note" class="status-text ok" hidden>服务器已配置 API Key，浏览器无需再填写。</div>
        <label class="field">
          <span>API Key</span>
          <input type="password" id="settings-key" autocomplete="off" placeholder="sk-...">
        </label>
        <label class="field">
          <span>Base URL</span>
          <input id="settings-base" placeholder="https://api.openai.com/v1">
        </label>
        <label class="field">
          <span>模型</span>
          <input id="settings-model" placeholder="gpt-4o-mini">
        </label>
        <div class="grid-2">
          <label class="field">
            <span>Temperature <em id="temp-val"></em></span>
            <input type="range" id="settings-temp" min="0" max="1.5" step="0.1" value="0.8">
          </label>
          <label class="field">
            <span>最大输出 tokens</span>
            <input type="number" id="settings-max" min="256" max="16384" step="256" value="6000">
          </label>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="ghost-btn" id="btn-test"><span class="ic" data-icon="zap"></span><span>测试连接</span></button>
        <button type="button" class="primary-btn" id="btn-save-settings"><span class="ic" data-icon="check"></span><span>保存</span></button>
      </div>
    </form>
  </dialog>

  <dialog id="import-dialog" class="modal">
    <form method="dialog" class="modal-card modal-wide">
      <div class="modal-head">
        <h2>导入设定</h2>
        <button class="icon-btn" value="cancel" aria-label="关闭"><span class="ic" data-icon="close"></span></button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>原始素材</span>
          <textarea id="import-text" rows="16" placeholder="粘贴你的全套设定，包括世界观、OC、反派、故事要求"></textarea>
        </label>
        <div id="import-status" class="status-text"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="ghost-btn" id="btn-import-clear"><span class="ic" data-icon="trash"></span><span>清空设定</span></button>
        <button type="button" class="primary-btn" id="btn-import-run"><span class="ic" data-icon="wand"></span><span>整理并填入</span></button>
      </div>
    </form>
  </dialog>

  <dialog id="check-dialog" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h2>设定一致性检查</h2>
        <button class="icon-btn" id="btn-close-check" aria-label="关闭"><span class="ic" data-icon="close"></span></button>
      </div>
      <div id="check-result" class="check-result"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
